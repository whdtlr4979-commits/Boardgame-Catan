<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2340">
  <meta name="description" content="PC와 모바일에서 즐기는 도트 아트 카탄 보드게임">
  <title>픽셀 카탄</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen">
      <div class="start-box pixel-box">
        <canvas id="logo" width="160" height="48" aria-hidden="true"></canvas>
        <h1>픽셀 카탄</h1>
        <p class="subtitle">섬을 개척하고 10점을 먼저 모으세요!</p>

        <div class="setting-row">
          <span class="label">인원</span>
          <div class="seg" id="player-count">
            <button type="button" data-n="3">3명</button>
            <button type="button" data-n="4" class="on">4명</button>
          </div>
        </div>
        <div id="seat-list"></div>

        <div class="start-actions">
          <button type="button" id="btn-new" class="btn primary big">새 게임</button>
          <button type="button" id="btn-continue" class="btn big hidden">이어하기</button>
          <button type="button" id="btn-rules" class="btn">게임 규칙</button>
        </div>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="screen hidden">
      <header id="topbar">
        <button type="button" id="btn-menu" class="btn small" aria-label="메뉴">메뉴</button>
        <div id="turn-info"></div>
        <div id="dice" aria-live="polite"></div>
      </header>
      <div id="players"></div>
      <div id="board-wrap">
        <canvas id="board"></canvas>
        <div id="prompt" aria-live="polite"></div>
      </div>
      <aside id="side">
        <div id="hand" class="pixel-box"></div>
        <div id="actions"></div>
        <details id="log-box" class="pixel-box" open>
          <summary>기록</summary>
          <ol id="log"></ol>
        </details>
      </aside>
    </section>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-box pixel-box"></div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
