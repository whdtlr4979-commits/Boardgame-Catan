<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a3d26">
  <meta name="description" content="PC와 모바일에서 친구·컴퓨터와 즐기는 카탄 보드게임">
  <title>카탄 개척자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen">
      <div class="start-box panel">
        <canvas id="logo" aria-hidden="true"></canvas>
        <h1>카탄 개척자</h1>
        <p class="subtitle">섬을 개척하고 10점을 먼저 모으세요!</p>

        <div class="setting-row">
          <span class="label">인원</span>
          <div class="seg" id="player-count">
            <button type="button" data-n="3">3명</button>
            <button type="button" data-n="4" class="on">4명</button>
          </div>
        </div>
        <div id="seat-list"></div>

        <div class="start-actions">
          <button type="button" id="btn-new" class="btn primary big">이 기기에서 새 게임</button>
          <button type="button" id="btn-continue" class="btn big hidden">이어하기</button>
        </div>

        <div class="online-box">
          <h2>온라인 대전</h2>
          <p class="online-note" id="online-note">서버 확인 중…</p>
          <div id="online-controls" class="hidden">
            <label class="field" for="online-name">내 이름
              <input id="online-name" type="text" maxlength="10" autocomplete="nickname">
            </label>
            <button type="button" id="btn-create-room" class="btn primary">방 만들기</button>
            <div class="join-row">
              <input id="room-code" type="text" maxlength="4" placeholder="방 코드" autocapitalize="characters" autocomplete="off" aria-label="방 코드">
              <button type="button" id="btn-join-room" class="btn">참가하기</button>
            </div>
            <button type="button" id="btn-rejoin" class="btn hidden">참가했던 방으로 돌아가기</button>
          </div>
        </div>

        <button type="button" id="btn-rules" class="btn rules-btn">게임 규칙</button>
      </div>
    </section>

    <!-- 온라인 대기실 -->
    <section id="lobby-screen" class="screen hidden">
      <div class="start-box panel">
        <h1 class="lobby-title">대기실</h1>
        <p class="subtitle">친구에게 방 코드나 초대 링크를 보내 주세요.</p>
        <div class="room-code" id="lobby-code" aria-label="방 코드"></div>
        <div class="invite-row">
          <input id="invite-link" type="text" readonly aria-label="초대 링크">
          <button type="button" id="btn-copy-link" class="btn small">복사</button>
        </div>
        <ol id="lobby-seats" class="lobby-seats"></ol>
        <p id="lobby-status" class="online-note"></p>
        <div class="start-actions">
          <button type="button" id="btn-add-ai" class="btn hidden">컴퓨터 추가</button>
          <button type="button" id="btn-start-online" class="btn primary big hidden">게임 시작</button>
          <button type="button" id="btn-leave-room" class="btn danger">나가기</button>
        </div>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="screen hidden">
      <header id="topbar">
        <button type="button" id="btn-menu" class="btn small" aria-label="메뉴">메뉴</button>
        <div id="turn-info"></div>
        <span id="net-status" class="net-status hidden"></span>
        <div id="dice" aria-live="polite"></div>
      </header>
      <div id="players"></div>
      <div id="board-wrap">
        <canvas id="board"></canvas>
        <div id="prompt" aria-live="polite"></div>
      </div>
      <aside id="side">
        <div id="hand" class="panel"></div>
        <div id="actions"></div>
        <details id="log-box" class="panel" open>
          <summary>기록</summary>
          <ol id="log"></ol>
        </details>
      </aside>
    </section>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-box panel"></div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
