# Render.com 블루프린트: 저장소를 연결하면 이 설정으로 서버가 배포됩니다.
services:
  - type: web
    name: pixel-catan
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # 방 상태를 저장할 Postgres 주소 (예: Neon 무료 데이터베이스). 비워 두면 메모리에만 보관합니다.
      - key: DATABASE_URL
        sync: false
