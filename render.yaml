# Render.com 블루프린트: New → Blueprint로 이 저장소를 연결하면 이 설정으로 서버가 배포됩니다.
# 처음 연결할 때 DATABASE_URL 값만 입력하면 됩니다.
services:
  - type: web
    name: pixel-catan
    runtime: node
    plan: free
    # 서울 Supabase와 가장 가까운 리전
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # 방 상태를 저장할 Postgres 주소 (예: Supabase Session pooler 주소). 비워 두면 메모리에만 보관합니다.
      - key: DATABASE_URL
        sync: false
      # 데이터베이스 연결을 암호화하되 인증서 검증은 생략 (Supabase pooler용)
      - key: DATABASE_SSL
        value: no-verify
